name: alambic
description: "Notification-first spaced repetition app."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  android_alarm_manager_plus: 5.1.2
  archive: 4.7.1
  drift: 2.35.4
  drift_flutter: 0.3.1
  file_picker: 13.4.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 23.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  image_picker: 1.2.4
  intl: 0.20.3
  material_ui: 1.11.1
  package_info_plus: 10.2.2
  path: 1.9.1
  path_provider: 2.1.6
  shared_preferences: 2.5.6
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.3
  build_runner: 2.17.1
  meta: 1.19.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/samples/capitals_en.txt
    - assets/samples/capitals_fr.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
